name: Grab guide

# Scrapes, with iptv-org/epg's grabber, only the published channels no ready-made feed carries
# (plan-grab.mjs), once a day: the sites list two or more days ahead, and the guide build reads the
# result as one more source, with the same due times and ETags. Runs before the 05:47 build.
on:
  schedule:
    - cron: "13 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: grab
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Plan the grab
        run: node plan-grab.mjs

      - name: Clone the grabber
        run: git clone --depth 1 https://github.com/iptv-org/epg grabber

      - id: cache
        uses: actions/cache@v4
        with:
          path: grabber/node_modules
          key: grabber-node-modules-${{ hashFiles('grabber/package-lock.json') }}

      # The grabber's lockfile changes rarely; a cache hit skips reinstalling ~70
      # packages from scratch every day.
      - name: Install the grabber
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: grabber
        run: npm ci --no-audit --no-fund

      # One process per site, four at a time, each capped in memory and time: run as one process the
      # grabber ran out of its 4 GB heap within a minute, and one bad site took every channel with it.
      # A site that fails costs only its own channels and is reported. Few connections per site and
      # a delay: this is someone else's server, asked once a day.
      - name: Grab
        working-directory: grabber
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          mkdir -p ../grab/out
          ls ../grab/sites/*.channels.xml | xargs -P 4 -I{} sh -c '
            site=$(basename {} .channels.xml)
            timeout 20m npm run --silent grab --- --channels={} --output=../grab/out/$site.xml --days=2 --maxConnections=2 --delay=250 > ../grab/out/$site.log 2>&1 \
              || { echo "::warning::$site failed: $(tail -n 3 ../grab/out/$site.log | tr "\n" " ")"; rm -f ../grab/out/$site.xml; }'
          cd .. && node merge-grab.mjs

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view grab >/dev/null 2>&1 || gh release create grab --title "Grabbed guide" --notes "Daily output of grab.yml; read by build.mjs." --latest=false
          gh release upload grab grab/guide.xml.gz --clobber

      - name: Keep the schedule enabled
        if: ${{ !cancelled() }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/grab.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
